<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="../css/hello.css">
    </head>

    <body>
        <div id="header">
            <div id="site">
                <span class="label">当前网站</span>
                <span id="hostname"></span>
                <span id="count"></span>
            </div>
            <p id="btn">
                <span id="btn-circle"></span>
                <span id="btn-text">OFF</span>
            </p>
        </div>

        <div id="confirm" hidden>
            <p id="confirm-text"></p>
            <div class="actions">
                <button id="confirm-cancel" class="btn-secondary">取消</button>
                <button id="confirm-ok" class="btn-primary">确认开启</button>
            </div>
        </div>

        <div id="trash-section">
            <h4>最近删除<span id="trash-count"></span></h4>
            <p id="trash-empty">暂无删除记录</p>
            <ul id="trash"></ul>
        </div>
    <script src="../script/hello.js" type="module"></script>
  </body>
</html>
