<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="popup.css">
    </head>

    <body>
        <div id="header">
            <div id="site">
                <span class="label" data-i18n="label_current_site"></span>
                <span id="hostname"></span>
                <span id="count"></span>
            </div>
            <p id="btn">
                <span id="btn-circle"></span>
                <span id="btn-text">OFF</span>
            </p>
        </div>

        <div id="confirm" hidden>
            <p id="confirm-text"></p>
            <div class="actions">
                <button id="confirm-cancel" class="btn-secondary" data-i18n="cancel"></button>
                <button id="confirm-ok" class="btn-primary" data-i18n="confirm_enable"></button>
            </div>
        </div>

        <div id="trash-section">
            <div id="trash-header">
                <button id="trash-toggle"><span id="trash-arrow">▸</span><span data-i18n="recently_deleted"></span><span id="trash-count"></span></button>
                <button id="trash-clear" data-i18n="clear"></button>
            </div>
            <div id="trash-body">
                <p id="trash-empty" data-i18n="trash_empty"></p>
                <ul id="trash"></ul>
            </div>
        </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
